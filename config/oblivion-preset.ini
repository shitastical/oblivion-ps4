; Oblivion settings preset for Playden on PS4.
;
; Not a whole Oblivion.ini: the installer merges these lines into the copy of
; Oblivion_default.ini that ships with your game, so every key you do not see
; here keeps its stock value. Nothing invented, nothing removed.
;
; Target: low-to-medium effects, medium textures, VSync on, 30 fps.
; Every value below is either the game's own "Medium" launcher preset or the
; usual community performance value for that key. See the README for what this
; is and is not expected to do.

[General]
; Read and write Oblivion.ini next to Oblivion.exe, not in the Wine prefix's
; "Documents\My Games" folder. That is the copy this installer can update.
bUseMyGamesDirectory=0
; Fewer distant cells kept loaded (stock 25).
uGridDistantCount=15
uGridDistantTreeRange=12

[Display]
iSize W=1280
iSize H=720
bFull Screen=1
; VSync.
iPresentInterval=1
iMultiSample=0
; Medium textures (0 = large, 1 = medium, 2 = small).
iTexMipMapSkip=1
; Shorter specular and environment-map ranges (stock 500/800).
fSpecularLOD1=250.0000
fSpecularLOD2=550.0000
fEnvMapLOD1=250.0000
fEnvMapLOD2=550.0000
; Canopy shadows and window reflections off; these are per-frame passes.
bDoCanopyShadowPass=0
bDynamicWindowReflections=0
; Shadows were already off in the stock file; keep them off.
bDrawShadows=0
bShadowsOnGrass=0
; Grass planes are individual draws, so drop the tall-grass pass.
bDoTallGrassEffect=0

[Grass]
; Stock 80. Higher = sparser grass; 150 is the usual low-end value.
iMinGrassSize=150
; Stock 2000 / 3000: grass only near the player.
fGrassStartFadeDistance=1000.0000
fGrassEndDistance=2000.0000
bDrawShaderGrass=1

[LOD]
; Distant trees off, and fewer LOD objects/actors/items (stock trees 1.2).
bDisplayLODTrees=0
fLODMultTrees=0.5000
fLODMultActors=3.0000
fLODMultItems=3.0000
fLODMultObjects=3.0000
fLODFadeOutMultActors=4.0000
fLODFadeOutMultItems=1.5000
fLODFadeOutMultObjects=3.0000

[Water]
bUseWaterReflections=0
bUseWaterDisplacements=0
bUseWaterHiRes=0

[BlurShaderHDR]
; HDR is the expensive lighting path; bloom stays on via [BlurShader].
bDoHighDynamicRange=0
