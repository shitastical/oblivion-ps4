[Core] ; Critical patches. Generally shouldn't disable these.
bPatchTextureFiltering=TRUE ; fix texture filtering so that it doesn't apply to the menu cursor; works around major quality issue
uTextureFilteringFlags=256  ; use bilinear interpolation for texture filtering; for values, see OBSE source for NiTexturingProperty::Map

[Debug]
bSwipeUnusedVanillaLogs=TRUE ; intercepts disabled vanilla debug logs; sends to NorthernUI.log

[Display]
bForceNativeResolutionUI=FALSE  ; disables screen size normalization. not recommended
fAutoHideCursorDelay=5.0        ; time in seconds before the cursor auto-hides
uLocalMapResolutionPerCell=1024 ; changes the render resolution of the Local Map; vanilla uses 256

[Features]
iQuantityMenuHandlerAlt=0     ; quantity menu behavior when Alt is held; takes priority over Ctrl
iQuantityMenuHandlerCtrl=0    ; quantity menu behavior when Ctrl is held
iQuantityMenuHandlerDefault=0 ; 0 = ask; 1 = always transfer one; 2 = always transfer all
iBarterConfirmHandlerAlt=0     ; when to show the confirmation prompt for bartering; only when Alt is held; takes priority over Ctrl
iBarterConfirmHandlerCtrl=0    ; ...when Ctrl is held
iBarterConfirmHandlerDefault=0 ; 0 = ask whenever the vanilla game would; 1 = only ask if items have non-zero value; 2 = never ask
bShowHUDClock=TRUE        ; show an in-game clock on the HUD
bShowHUDInputViewer=FALSE ; show an in-game input viewer for gamepad controls
bSuppressDLCStartup=FALSE ; suppress DLC quest-start notifications
bUsePlaystationButtonIcons=TRUE ; use Playstation button icons/names instead of Xbox ones
;
; Enhanced movement: various hacks and patches to allow an increased 
; freedom of movement when playing with a gamepad.
;
bEnhancedMovement360Movement=TRUE ; Replace 8-directional WASD movement with full 360-degree joystick movement
iEnhancedMovementCameraMode=0     ; 0 = Oblivion; 1 = Skyrim; 2 = move/turn independently of camera
iCameraInertiaMode=1              ; 0 = Unchanged, 1 = Fixed, 2 = Disabled

[Menus] ; Patches for installing menus, as opposed to patches that show/hide always-installed menus
bUseXXNAlchemyMenu=TRUE ; replace the vanilla AlchemyMenu with an enhanced class
;
; bUseXXNSampleInventoryMenu: Replace the vanilla AlchemyMenu with a test menu, if 
; the AlchemyMenu hasn't already been replaced.
;
bUseXXNSampleInventoryMenu=FALSE

[XInput] ; For gamepad support.
bEnabled=TRUE                 ; controls whether we patch the game engine to take over gamepad controls
bDontUseEvenWhenPatched=FALSE ; if set to TRUE, NorthernUI pretends that there are no gamepads connected
bToggleAlwaysRunWorks=FALSE  ; determines whether Toggle Always Run affects joystick-initiated movement
bMenuConsumesDPad=TRUE       ; allow the D-Pad to be used for keyboard navigation
uMenuJoystickRateInitial=300 ; holding the joystick in a direction fires a keynav event every W ms, at first
uMenuJoystickRateMod=     75 ; after every few events, the rate decreases by X ms
uMenuJoystickRateMin=     75 ; keynav events never fire faster than Y ms
uMenuJoystickRateUsedFor=  3 ; rate decreases every Z-th events
fMapMenuPanSpeed=     4.0000 ; speed at which the gamepad cursor pans the world or local maps; 5 is on the quick side
fJoystickSensAccelOffset=0.8 ; when you start looking, you turn at your chosen sensitivity minus this value
fJoystickSensAccelTime=  1.0 ; number of seconds it takes to reach full look sensitivity
fLookSensitivityMin=     1.0 ; minimum look sensitivity selectable in the UI
fLookSensitivityStep=    0.8 ; maps look sensitivity steps in the UI to real values (degrees per 1% joystick tilt per second)
iLookSensitivityStepCount= 6 ; number of look sensitivity steps selectable in the UI
iPlayerMenuModelJoystickMaxRotateSpeed=400 ; player-model-in-menu rotation: max joystick input converts to this many X-axis mouse pixels per second
iPlayerMenuModelJoystickMaxZoomSpeed=  200 ; player-model-in-menu zoom:     max joystick input converts to this many Y-axis mouse pixels per second
